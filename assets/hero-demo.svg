<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)" rx="0" />

  <text x="600" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
        font-size="32" font-weight="700" fill="#f8fafc">
    From recorded agent run to passing regression test
  </text>

  <g transform="translate(70, 110)">
    <rect width="260" height="220" rx="16" fill="url(#card)" filter="url(#shadow)" />
    <text x="130" y="35" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="14" font-weight="600" fill="#334155">Input: session.jsonl</text>
    <rect x="25" y="60" width="210" height="22" rx="6" fill="#e2e8f0" />
    <text x="35" y="76" font-family="ui-monospace, monospace" font-size="11" fill="#475569">{"type": "user", ...}</text>
    <rect x="25" y="92" width="210" height="22" rx="6" fill="#e2e8f0" />
    <text x="35" y="108" font-family="ui-monospace, monospace" font-size="11" fill="#475569">{"type": "assistant", ...}</text>
    <rect x="25" y="124" width="210" height="22" rx="6" fill="#e2e8f0" />
    <text x="35" y="140" font-family="ui-monospace, monospace" font-size="11" fill="#475569">{"role": "tool", ...}</text>
    <rect x="25" y="156" width="210" height="22" rx="6" fill="#e2e8f0" />
    <text x="35" y="172" font-family="ui-monospace, monospace" font-size="11" fill="#475569">{"type": "assistant", ...}</text>
    <text x="130" y="205" text-anchor="middle" font-family="ui-sans-serif, sans-serif"
          font-size="12" fill="#64748b">Claude Code / OpenAI / agent-vcr</text>
  </g>

  <g transform="translate(360, 185)">
    <path d="M0,30 L70,30 L60,15 M70,30 L60,45" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="-20" y="-22" width="110" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="35" y="0" text-anchor="middle" font-family="ui-sans-serif, sans-serif"
          font-size="12" font-weight="600" fill="#38bdf8">transcript-to-test</text>
  </g>

  <g transform="translate(470, 110)">
    <rect width="260" height="220" rx="16" fill="url(#card)" filter="url(#shadow)" />
    <text x="130" y="35" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="14" font-weight="600" fill="#334155">Output: test_session.py</text>
    <rect x="25" y="60" width="210" height="22" rx="6" fill="#dbeafe" />
    <text x="35" y="76" font-family="ui-monospace, monospace" font-size="11" fill="#1e40af">TOOL_REGISTRY = {...}</text>
    <rect x="25" y="92" width="210" height="22" rx="6" fill="#dbeafe" />
    <text x="35" y="108" font-family="ui-monospace, monospace" font-size="11" fill="#1e40af">EXPECTED_TURNS = [...]</text>
    <rect x="25" y="124" width="210" height="22" rx="6" fill="#dbeafe" />
    <text x="35" y="140" font-family="ui-monospace, monospace" font-size="11" fill="#1e40af">def run_agent(...)</text>
    <rect x="25" y="156" width="210" height="22" rx="6" fill="#dcfce7" />
    <text x="35" y="172" font-family="ui-monospace, monospace" font-size="11" fill="#166534">def test_session()</text>
    <text x="130" y="205" text-anchor="middle" font-family="ui-sans-serif, sans-serif"
          font-size="12" fill="#64748b">Standalone, zero deps</text>
  </g>

  <g transform="translate(760, 185)">
    <path d="M0,30 L70,30 L60,15 M70,30 L60,45" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="-15" y="-22" width="100" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="35" y="0" text-anchor="middle" font-family="ui-sans-serif, sans-serif"
          font-size="12" font-weight="600" fill="#38bdf8">pytest</text>
  </g>

  <g transform="translate(870, 110)">
    <rect width="260" height="220" rx="16" fill="url(#card)" filter="url(#shadow)" />
    <text x="130" y="35" text-anchor="middle" font-family="ui-sans-serif, sans-serif"
          font-size="14" font-weight="600" fill="#334155">Result</text>
    <circle cx="130" cy="100" r="40" fill="#dcfce7" />
    <path d="M110,100 L125,115 L155,85" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <text x="130" y="165" text-anchor="middle" font-family="ui-monospace, monospace"
          font-size="14" font-weight="600" fill="#166534">1 passed in 0.01s</text>
    <text x="130" y="190" text-anchor="middle" font-family="ui-sans-serif, sans-serif"
          font-size="12" fill="#64748b">Offline · Deterministic · Fast</text>
  </g>

  <g transform="translate(0, 360)" fill="#94a3b8" font-family="ui-sans-serif, sans-serif" font-size="12">
    <text x="600" y="0" text-anchor="middle">No model calls · No live tools · No runtime dependencies · Generated tests run anywhere</text>
  </g>
</svg>
